name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v

      - name: Run baseline vs final evaluation
        run: python -m evaluation.run_eval

      - name: Enforce measured improvement
        run: |
          python - <<'PY'
          import json
          result = json.load(open("evaluation/results/latest.json"))
          assert result["final"]["f1"] >= 0.80
          assert result["final"]["f1"] > result["baseline"]["f1"]
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datasense-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: datasense-ui/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
